# Holding page for the server IP and unmatched host names.
# The leading underscore keeps this name from clashing with any account name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/_holding;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
